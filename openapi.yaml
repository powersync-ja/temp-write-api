openapi: 3.0.3
info:
  title: PowerSync Backend API
  description: Contract between the demo app connector and the backend.
  version: 1.0.0

servers:
  - url: http://localhost:6060
    description: Local development

paths:
  /api/data:
    post:
      operationId: postCrudTransaction
      summary: Apply a transaction of CRUD operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrudTransaction"
      responses:
        "200":
          description: >
            Transaction result. Always returns 200 — the outcome
            is determined by the status field in the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/data/batch:
    post:
      operationId: postTransactionBatch
      summary: Apply a batch of transactions, each in its own database transaction
      description: >
        Applies each transaction in the batch in order, each in its own database
        transaction. Stops at the first failure of any kind.

        Results holds one entry per transaction sent, in the same order and
        always the same length as the request. Entries are matched to
        transactions positionally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBatch"
      responses:
        "200":
          description: >
            Batch result. Always returns 200 — outcomes are carried by the
            per-transaction status values in results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionBatchResponse"
        "400":
          description: >
            Request body failed validation, e.g. an empty batch or more
            transactions than the declared maximum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/data/transactions/{transactionId}/operations:
    post:
      operationId: postTransactionOperations
      summary: Stage operations as part of a large transaction
      description: >
        For transactions too large for a single postCrudTransaction call.
        Saves the given operations to the transactionId staging area without processing.
        beginTransaction must have been called first.
        Can be called repeatedly with the same transactionId to accumulate more operations before committing.
        Staged operations that are never committed are discarded after a server-defined TTL.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CrudEntry"
      responses:
        "202":
          description: Operations accepted into the staging area for the specified transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagedOperationsResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: >
            Unknown transaction. Either beginTransaction was never called for this id, or it has been garbage collected.
            The client must not assume its earlier operations calls for this id were preserved and should restart with beginTransaction under a fresh id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Transaction has already been committed; staging is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/data/transactions/{transactionId}/commit:
    post:
      operationId: commitTransaction
      summary: Commit a staged transaction
      description: >
        Idempotent, calling commit again on an already-committed transaction returns its current status without reprocessing.
        Committing runs the staged operations as a background batch, so this always returns immediately with a pending/processing status.
        Poll getTransactionStatus for the outcome.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "202":
          description: Commit accepted. Processing started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Unknown transaction, either nothing was begun/staged or this transaction has been garbage collected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/data/transactions/{transactionId}:
    put:
      operationId: beginTransaction
      summary: Begin staging a large transaction
      description: >
        Creates the staging area for transactionId, identified by the client-generated UUID in the path.
        Operations can only be staged against a transaction that has been explicitly begun, so this must be called before postTransactionOperations can be invoked against a transactionId.
        Idempotent while the transaction is still staging, meaning it is safe to retry after a dropped connection and will not create a second transaction or duplicate staged operations.
        Returns the current staged_count, so a reconnecting client can tell where it left off, or if a transaction has already been committed, or has been garbage collected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "201":
          description: Transaction begun.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagedOperationsResponse"
        "200":
          description: Transaction was already staging; returned its current state without changing anything.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagedOperationsResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Transaction has already been committed, so it can no longer be begun again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

    get:
      operationId: getTransactionStatus
      summary: Query the status/result of a committed transaction
      description: >
        Results are retained for a server-defined TTL after commit completes, then garbage collected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Current transaction status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Unknown transaction, either nothing was begun/staged or this transaction has been garbage collected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  parameters:
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: Client-generated UUID identifying a staged/committed transaction.
        This must be unique for each transaction.
        DO NOT reuse CrudTransaction.transaction_id values across transactions.
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT authenticating the writer to the backend.

  schemas:
    CrudTransaction:
      type: object
      required:
        - crud
      properties:
        crud:
          type: array
          items:
            $ref: "#/components/schemas/CrudEntry"
        transaction_id:
          type: integer
          format: int64
          description: Groups changes from the same transaction; null if no explicit transaction

    CrudEntry:
      type: object
      required:
        - id
        - op
        - table
      properties:
        id:
          type: string
          description: ID of the changed row
        op:
          type: string
          enum:
            - PUT
            - PATCH
            - DELETE
          description: Type of change
        table:
          type: string
          description: Table that contained the change
        transaction_id:
          type: integer
          format: int64
          description: Auto-incrementing transaction id
        op_data:
          type: object
          additionalProperties: true
          description: Data associated with the change
        previous_values:
          type: object
          additionalProperties: true
          description: Previous values for UPDATE/DELETE (when trackPreviousValues is enabled)
        metadata:
          type: string
          description: Client-side metadata (when trackMetadata is enabled)

    TransactionBatch:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 50
          description: >
            Whole transactions to apply, in upload-queue order. A transaction is
            never split across batches.
          items:
            $ref: "#/components/schemas/CrudTransaction"
        on_fatal_error:
          type: string
          enum: [stop, skip]
          default: stop
          description: >
            What to do when a transaction fails fatally.

            stop (default): the batch ends; every transaction after it is
              reported as not_attempted.
            skip: the failing transaction is dropped and the batch continues.
              Its result still reports fatal_error with the error
              classification, so the client can record that it discarded the
              transaction.

            Applies to fatal failures only. A retryable failure always ends the
            batch.

    TransactionBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: >
            One result per transaction sent, in the same order. Always the same
            length as the transactions array in the request.
          items:
            $ref: "#/components/schemas/TransactionResponse"

    TransactionResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, processing, success, retryable_error, fatal_error, not_attempted]
          description: >
            pending: transaction committed, batch job not yet started.
              Only returned by the staged-transaction commit/status
              endpoints, never by postCrudTransaction.
            processing: batch job running. Only returned by the
              staged-transaction commit/status endpoints.
            success: entire transaction persisted, safe to complete.
            retryable_error: transient failure, transaction rolled back,
              client should retry.
            fatal_error: transaction rolled back due to a non-recoverable
              issue — see failed_operation for details.
            not_attempted: the batch ended before this transaction was reached,
              so nothing was applied.
        retry_after_ms:
          type: integer
          description: >
            Suggested retry delay in ms. Only meaningful for
            retryable_error.
        failed_operation:
          description: >
            Present when status is fatal_error. Identifies what
            caused the rollback.
          allOf:
            - $ref: "#/components/schemas/FailedOperation"
        message:
          type: string
          description: Human-readable summary for logging/debugging.

    FailedOperation:
      type: object
      required: [error_code]
      properties:
        error_code:
          type: string
          description: >
            Machine-readable classification. Open-ended and backend-specific;
            the values emitted today are NOT_NULL_VIOLATION,
            UNIQUE_VIOLATION, FOREIGN_KEY_VIOLATION, CHECK_VIOLATION,
            CONSTRAINT_VIOLATION (a constraint the backend could not identify
            more precisely), INVALID_DATA (a value that cannot be stored in the
            column, e.g. malformed or out of range), SCHEMA_MISMATCH and
            DOCUMENT_VALIDATION_FAILURE.
        message:
          type: string
          description: Human-readable error detail.

    StagedOperationsResponse:
      type: object
      required: [transaction_id, staged_count]
      properties:
        transaction_id:
          type: string
          format: uuid
        staged_count:
          type: integer
          description: Total number of operations staged for this transaction so far, across all operations calls.

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
